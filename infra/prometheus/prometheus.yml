# Prometheus PULLS metrics: every scrape_interval it GETs each target's /metrics.
# Targets are Compose service names (Docker's DNS), so a recreated container is found again.
# Config changes need `docker compose restart prometheus`.
global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - alerts.yml                             # alert rules (Step 13.8), same directory

scrape_configs:
  - job_name: services                     # every FastAPI service: GET /metrics (chassis setup_metrics)
    # DNS discovery (Step 14.4): a name resolves to EVERY replica of a service (application runs 2), and
    # each replica is scraped on its own. Re-resolved every 30 s, so replicas coming and going are followed
    dns_sd_configs:
      - { names: [identity], type: A, port: 8001 }
      - { names: [job], type: A, port: 8002 }
      - { names: [job_enrichment], type: A, port: 8003 }
      - { names: [candidate], type: A, port: 8004 }
      - { names: [application], type: A, port: 8005 }
      - { names: [scoring], type: A, port: 8006 }
      - { names: [notification], type: A, port: 8007 }
      - { names: [analytics], type: A, port: 8008 }
      - { names: [bff_web], type: A, port: 8011 }
    relabel_configs: &service_label        # the name looked up -> service="application" (dashboards group by it)
      - source_labels: [__meta_dns_name]
        target_label: service

  - job_name: temporal-workers             # the Temporal SDK's own metrics (chassis temporal.py, :9464)
    dns_sd_configs:
      - { names: [job], type: A, port: 9464 }
      - { names: [job_enrichment], type: A, port: 9464 }
      - { names: [application], type: A, port: 9464 }
      - { names: [scoring], type: A, port: 9464 }
    relabel_configs: *service_label

  - job_name: rabbitmq                     # Celery queue depth: messages waiting per queue
    metrics_path: /metrics/detailed
    params:
      family: [queue_coarse_metrics]       # per-queue numbers (the default endpoint only has totals)
    static_configs:
      - targets: [rabbitmq:15692]

  - job_name: gateway                      # APISIX prometheus plugin (export_addr in infra/apisix/config.yaml)
    metrics_path: /apisix/prometheus/metrics
    static_configs:
      - targets: [gateway:9091]

  - job_name: prometheus                   # Prometheus' own health
    static_configs:
      - targets: [localhost:9090]
