# Loads every JSON file in /var/lib/grafana/dashboards (infra/grafana/dashboards in the repo) at
# startup and re-reads it every 30 s. The JSON in git is the source of truth: edit it there (or edit in
# the UI, then "Export -> JSON" back into the file); UI-only changes are overwritten.
apiVersion: 1

providers:
  - name: smarthire
    folder: SmartHire
    type: file
    allowUiUpdates: false
    updateIntervalSeconds: 30
    options:
      path: /var/lib/grafana/dashboards
