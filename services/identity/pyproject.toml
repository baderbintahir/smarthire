[project]
name = "smarthire-identity"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "smarthire-common",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "argon2-cffi>=23.1",          # password hashing
    "pyjwt[crypto]>=2.9",         # JWT creation/verification; [crypto] adds RSA support
    "email-validator>=2.1",       # needed by pydantic's EmailStr
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres,redis]>=4.8",  # real Postgres/Redis in throwaway containers for tests
]

[tool.uv]
package = false  # an application, not an installable library

[tool.uv.sources]
# Relative path: works on the host AND in the image (Dockerfile mirrors this layout)
smarthire-common = { path = "../../libs/smarthire_common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the service is not an installed package: make `import app` work under plain `pytest`
asyncio_mode = "auto"
