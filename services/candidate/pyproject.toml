[project]
name = "smarthire-candidate"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "smarthire-common",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
    "minio>=7.2",  # S3 client for MinIO (resume files)
    "python-multipart>=0.0.9",  # FastAPI needs it to parse file uploads (multipart/form-data)
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers[postgres,redis,minio]>=4.8",  # real Postgres/Redis/MinIO for tests
]

[tool.uv]
package = false  # an application, not an installable library

[tool.uv.sources]
# Relative path: works on the host AND in the image (Dockerfile mirrors this layout)
smarthire-common = { path = "../../libs/smarthire_common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the service is not an installed package: make `import app` work under plain `pytest`
asyncio_mode = "auto"
