[project]
name = "smarthire-template"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "smarthire-common",
    "uvicorn[standard]>=0.30",
    "alembic>=1.13",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "httpx>=0.27"]

[tool.uv]
package = false  # an application, not an installable library

[tool.uv.sources]
# Relative path: works on the host AND in the image (Dockerfile mirrors this layout)
smarthire-common = { path = "../../libs/smarthire_common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
