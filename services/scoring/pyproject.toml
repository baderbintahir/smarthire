[project]
name = "smarthire-scoring"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "smarthire-common[temporal,mongo]",
    "uvicorn[standard]>=0.30",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "testcontainers>=4.8",  # real MongoDB (replica set) for tests
]

[tool.uv]
package = false  # an application, not an installable library

[tool.uv.sources]
# Relative path: works on the host AND in the image (Dockerfile mirrors this layout)
smarthire-common = { path = "../../libs/smarthire_common", editable = true }

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # the service is not an installed package: make `import app` work under plain `pytest`
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
