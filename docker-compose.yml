services:
  postgres:
    image: postgres:16
    # Step 14.3: room for every pool (6 APIs x (5 + 5 overflow) + 4 worker processes x 2 = 68), psql,
    # migrations and a second replica of a service. Raise WITH the pools, never instead of sizing them
    command: ["postgres", "-c", "max_connections=150"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by infra/postgres/init.sh to create one DB user per service
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      JOB_DB_PASSWORD: ${JOB_DB_PASSWORD}
      CANDIDATE_DB_PASSWORD: ${CANDIDATE_DB_PASSWORD}
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    ports:
      - "127.0.0.1:5432:5432"                      # host tools only; never the LAN (Step 14.1 review)
    volumes:
      - pgdata:/var/lib/postgresql/data          # survives `down`, wiped by `down -v`
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro  # runs once, on an empty volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    # Design v1.2: Redis holds login (refresh) sessions, not just caches. Append-only file, fsync every
    # second (a crash loses at most ~1 s of writes); noeviction: never drop keys to free memory
    command: ["redis-server", "--appendonly", "yes", "--appendfsync", "everysec", "--maxmemory-policy", "noeviction"]
    ports:
      - "127.0.0.1:6379:6379"                      # no password locally: localhost only
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/identity/Dockerfile
    environment:
      SERVICE_NAME: identity
      TRACING_ENABLED: "true"                     # spans to Jaeger (Phase 13)
      PORT: "8001"
      DATABASE_URL: postgresql+asyncpg://identity_user:${IDENTITY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: identity
      REDIS_URL: redis://redis:6379/0
      JWT_PRIVATE_KEY_PATH: /run/secrets/identity/jwt_private.pem
      # Browsers reach Identity through the gateway, so the cookie must match the PUBLIC path
      REFRESH_COOKIE_PATH: /api/identity/auth
      # Uvicorn takes the client IP from X-Forwarded-For ONLY when the request comes from the
      # gateway's fixed address; from anyone else the header is ignored (it could be forged)
      FORWARDED_ALLOW_IPS: 172.30.0.10
    volumes:
      # Dev key from `make keys` (gitignored). Read-only inside the container.
      - ./secrets/identity:/run/secrets/identity:ro
    ports:
      - "127.0.0.1:8001:8001"                      # debugging only: clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  job:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/job/Dockerfile
    environment:
      SERVICE_NAME: job
      TRACING_ENABLED: "true"                     # spans to Jaeger (Phase 13)
      PORT: "8002"
      DATABASE_URL: postgresql+asyncpg://job_user:${JOB_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: job
      REDIS_URL: redis://redis:6379/0              # token denylist (Identity writes, we read)
      FORWARDED_ALLOW_IPS: 172.30.0.10             # trust X-Forwarded-For only from the gateway
    ports:
      - "127.0.0.1:8002:8002"                      # debugging only: clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    # Community fork of MinIO: the official minio/minio images are no longer published. Pinned.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "127.0.0.1:9000:9000"                      # S3 API (presigned links use localhost:9000)
      - "127.0.0.1:9001:9001"                      # web console: http://localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:                                      # one-shot: bucket + least-privilege user, then exits
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z  # same image: it ships the `mc` client
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CANDIDATE_S3_ACCESS_KEY: ${CANDIDATE_S3_ACCESS_KEY}
      CANDIDATE_S3_SECRET_KEY: ${CANDIDATE_S3_SECRET_KEY}
    volumes:
      - ./infra/minio:/init:ro
    depends_on:
      minio:
        condition: service_healthy

  candidate:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/candidate/Dockerfile
    environment:
      SERVICE_NAME: candidate
      TRACING_ENABLED: "true"                     # spans to Jaeger (Phase 13)
      PORT: "8004"
      DATABASE_URL: postgresql+asyncpg://candidate_user:${CANDIDATE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: candidate
      REDIS_URL: redis://redis:6379/0              # token denylist (Identity writes, we read)
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000           # what browsers use: download links are signed for it
      S3_ACCESS_KEY: ${CANDIDATE_S3_ACCESS_KEY}    # the service's own MinIO user (resumes bucket only)
      S3_SECRET_KEY: ${CANDIDATE_S3_SECRET_KEY}
      FORWARDED_ALLOW_IPS: 172.30.0.10             # trust X-Forwarded-For only from the gateway
    ports:
      - "127.0.0.1:8004:8004"                      # debugging only: clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully  # bucket and user exist before we start
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  candidate-parser:                                # design v2.1: parses resumes (ResumeProcessingWorkflow's step)
    build:
      context: .
      dockerfile: services/candidate/Dockerfile    # the Candidate image: the orchestrator calls its
                                                   # /internal/resumes/{id}/parse here, so CPU-heavy parsing
                                                   # never slows the public API (it replaced the Celery worker)
    environment:
      SERVICE_NAME: candidate-parser
      TRACING_ENABLED: "true"
      PORT: "8004"
      DATABASE_URL: postgresql+asyncpg://candidate_user:${CANDIDATE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: candidate
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: minio:9000
      S3_PUBLIC_ENDPOINT: localhost:9000
      S3_ACCESS_KEY: ${CANDIDATE_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${CANDIDATE_S3_SECRET_KEY}
      DB_POOL_SIZE: 2
      DB_MAX_OVERFLOW: 0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  application:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/application/Dockerfile
    environment:
      SERVICE_NAME: application
      TRACING_ENABLED: "true"                     # spans to Jaeger (Phase 13)
      PORT: "8005"
      DATABASE_URL: postgresql+asyncpg://application_user:${APPLICATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: application
      REDIS_URL: redis://redis:6379/0              # token denylist + idempotency keys
      CANDIDATE_URL: http://candidate:8004         # applicant's profile at apply time (user's own token)
      FORWARDED_ALLOW_IPS: 172.30.0.10             # trust X-Forwarded-For only from the gateway
    # Step 14.4: the load test showed ONE Application process saturating one CPU core (Python runs one
    # thread of Python at a time). Two replicas share the work: APISIX and Prometheus find both through
    # Docker's DNS (`application` resolves to every replica); so does the orchestrator for its steps.
    # No host port: two replicas can't both publish 8005 (debug with `docker compose exec application ...`)
    deploy:
      replicas: 2
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  job_enrichment:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/job_enrichment/Dockerfile
    environment:
      SERVICE_NAME: job_enrichment
      TRACING_ENABLED: "true"                     # spans to Jaeger (Phase 13)
      PORT: "8003"
      MONGO_URL: mongodb://mongo:27017/?directConnection=true
      MONGO_DATABASE: enrichment
      TEMPORAL_ADDRESS: temporal:7233              # its worker polls enrichment-tq
    ports:
      - "127.0.0.1:8003:8003"                      # internal read API (not routed via the gateway)
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  scoring:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/scoring/Dockerfile
    environment:
      SERVICE_NAME: scoring
      TRACING_ENABLED: "true"                     # spans to Jaeger (Phase 13)
      PORT: "8006"
      MONGO_URL: mongodb://mongo:27017/?directConnection=true
      MONGO_DATABASE: scoring
      CANDIDATE_URL: http://candidate:8004         # internal API: parsed resumes
      ENRICHMENT_URL: http://job_enrichment:8003   # internal API: structured jobs
    ports:
      - "127.0.0.1:8006:8006"                      # internal read API (not routed via the gateway)
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  notification:                                    # consumes events, queues emails (no public API)
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment:
      SERVICE_NAME: notification
      TRACING_ENABLED: "true"                     # spans to Jaeger (Phase 13)
      PORT: "8007"
      DATABASE_URL: postgresql+asyncpg://notification_user:${NOTIFICATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: notification
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:8007:8007"                      # health only
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  mailpit:
    image: axllent/mailpit:v1.31.4                 # catches every email; nothing leaves your machine
    ports:
      - "127.0.0.1:1025:1025"                      # SMTP
      - "127.0.0.1:8025:8025"                      # web UI + API: http://localhost:8025

  analytics:
    build:
      context: .
      dockerfile: services/analytics/Dockerfile
    environment:
      SERVICE_NAME: analytics
      TRACING_ENABLED: "true"                     # spans to Jaeger (Phase 13)
      PORT: "8008"
      DATABASE_URL: postgresql+asyncpg://analytics_user:${ANALYTICS_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: analytics
      REDIS_URL: redis://redis:6379/0              # token denylist + metrics cache
      FORWARDED_ALLOW_IPS: 172.30.0.10
    ports:
      - "127.0.0.1:8008:8008"                      # debugging only: clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8008/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  bff_web:                                         # Backend for Frontend (Phase 12B): composes screens, no DB
    build:
      context: .
      dockerfile: services/bff_web/Dockerfile
    environment:
      SERVICE_NAME: bff_web
      TRACING_ENABLED: "true"                     # spans to Jaeger (Phase 13)
      PORT: "8011"
      REDIS_URL: redis://redis:6379/0              # token denylist (the BFF verifies tokens too)
      FORWARDED_ALLOW_IPS: 172.30.0.10
    ports:
      - "127.0.0.1:8011:8011"                      # debugging only: clients go through the gateway
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8011/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  orchestrator:                                    # design v2.1: runs every workflow, the only Temporal client
    build:
      context: .
      dockerfile: services/orchestrator/Dockerfile
    environment:
      SERVICE_NAME: orchestrator
      TRACING_ENABLED: "true"
      PORT: "8012"
      TEMPORAL_ADDRESS: temporal:7233
    volumes:
      # Keys from `make keys` (gitignored): token signing + payload encryption. Read-only, this service only
      - ./secrets/orchestrator:/run/secrets/orchestrator:ro
    # Two replicas: both poll orchestrator-tq, and services reach either one as orchestrator:8012 (Docker DNS).
    # No host port (internal only; two replicas can't publish the same port anyway)
    deploy:
      replicas: 2
    depends_on:
      temporal:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8012/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  # ------------------------------------------------------------ workflows + documents (Phase 9)
  temporal:
    # Temporal's dev server (temporal CLI): server + Web UI in one process, state in a SQLite file.
    # Production runs temporalio/server on Postgres/Cassandra with a separate UI; the old all-in-one
    # temporalio/auto-setup image is no longer maintained (last tag mid-2026). Pinned.
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0", "--ui-port", "8233",
              "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"                      # gRPC: workers and clients connect here (no auth)
      - "127.0.0.1:8088:8233"                      # Web UI: http://localhost:8088
    volumes:
      - temporaldata:/home/temporal                # workflow histories survive restarts
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:8.0.34
    # A single-node REPLICA SET (kept from Phase 10, when Scoring's Mongo outbox needed transactions; it costs
    # nothing and keeps the door open for them). Clients use ?directConnection=true
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"                    # no auth locally (like Redis): localhost only
    volumes:
      - mongodata:/data/db
    healthcheck:                                   # also initiates the replica set on first start
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  # ---------------------------------------------------------------- observability (Phase 13)
  jaeger:
    # Jaeger v2 all-in-one: OTLP receiver + in-memory trace store + UI. Traces are lost on restart (dev only).
    # Pinned to 2.20.0: 2.21 removed the v1 HTTP query API that Grafana 13.2's Jaeger data source still
    # calls (grafana/grafana-jaeger-datasource#87). Upgrade once Grafana moves to /api/v3.
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "127.0.0.1:16686:16686"                    # UI: http://localhost:16686
    # OTLP :4317 (gRPC) and :4318 (HTTP) are reached by services inside the Compose network only

  prometheus:
    image: prom/prometheus:v3.13.4
    volumes:
      - ./infra/prometheus:/etc/prometheus:ro       # prometheus.yml (changes need a restart)
      - promdata:/prometheus                        # metric history survives restarts
    ports:
      - "127.0.0.1:9090:9090"                      # UI: http://localhost:9090 (no auth: localhost only)

  grafana:
    image: grafana/grafana:13.2.5
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro   # data sources + dashboard provider
      - ./infra/grafana/dashboards:/var/lib/grafana/dashboards:ro   # dashboards as JSON (Step 13.6)
      - grafanadata:/var/lib/grafana
    ports:
      - "127.0.0.1:3001:3000"                      # http://localhost:3001, admin/admin (local dev only; host 3000 is often taken by node dev servers)
    depends_on:
      - prometheus
      - jaeger

  gateway:
    image: apache/apisix:3.19.0-debian              # pinned: upgrades are a deliberate change
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro   # routes (standalone mode)
      - ./infra/apisix/plugins:/usr/local/apisix/custom/apisix/plugins:ro  # our Lua plugins
    ports:
      - "8000:9080"                                  # the one public entry point
    # :9091 (Prometheus metrics) is reachable inside the Compose network only, not published
    networks:
      default:
        ipv4_address: 172.30.0.10                    # fixed: services trust X-Forwarded-For from it
    depends_on:
      redis:
        condition: service_healthy                   # rate-limit counters and denylist live there
    healthcheck:                                     # no curl in the image: bash's /dev/tcp instead
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
  temporaldata:
  mongodata:
  promdata:
  grafanadata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24                      # fixed range so the gateway can have a fixed IP
