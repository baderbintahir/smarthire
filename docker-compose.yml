services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
      # Read by infra/postgres/init.sh to create one DB user per service
      IDENTITY_DB_PASSWORD: ${IDENTITY_DB_PASSWORD}
      JOB_DB_PASSWORD: ${JOB_DB_PASSWORD}
      CANDIDATE_DB_PASSWORD: ${CANDIDATE_DB_PASSWORD}
      APPLICATION_DB_PASSWORD: ${APPLICATION_DB_PASSWORD}
      NOTIFICATION_DB_PASSWORD: ${NOTIFICATION_DB_PASSWORD}
      ANALYTICS_DB_PASSWORD: ${ANALYTICS_DB_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data          # survives `down`, wiped by `down -v`
      - ./infra/postgres/init.sh:/docker-entrypoint-initdb.d/init.sh:ro  # runs once, on an empty volume
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  identity:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/identity/Dockerfile
    environment:
      SERVICE_NAME: identity
      PORT: "8001"
      DATABASE_URL: postgresql+asyncpg://identity_user:${IDENTITY_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: identity
      REDIS_URL: redis://redis:6379/0
      JWT_PRIVATE_KEY_PATH: /run/secrets/identity/jwt_private.pem
      # Browsers reach Identity through the gateway, so the cookie must match the PUBLIC path
      REFRESH_COOKIE_PATH: /api/identity/auth
      # Uvicorn takes the client IP from X-Forwarded-For ONLY when the request comes from the
      # gateway's fixed address; from anyone else the header is ignored (it could be forged)
      FORWARDED_ALLOW_IPS: 172.30.0.10
    volumes:
      # Dev key from `make keys` (gitignored). Read-only inside the container.
      - ./secrets/identity:/run/secrets/identity:ro
    ports:
      - "127.0.0.1:8001:8001"                      # debugging only: clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  job:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/job/Dockerfile
    environment:
      SERVICE_NAME: job
      PORT: "8002"
      DATABASE_URL: postgresql+asyncpg://job_user:${JOB_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: job
      REDIS_URL: redis://redis:6379/0              # token denylist (Identity writes, we read)
      FORWARDED_ALLOW_IPS: 172.30.0.10             # trust X-Forwarded-For only from the gateway
    ports:
      - "127.0.0.1:8002:8002"                      # debugging only: clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  minio:
    # Community fork of MinIO: the official minio/minio images are no longer published. Pinned.
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "9000:9000"                                # S3 API
      - "9001:9001"                                # web console: http://localhost:9001
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 10

  minio-init:                                      # one-shot: bucket + least-privilege user, then exits
    image: pgsty/minio:RELEASE.2026-08-04T00-00-00Z  # same image: it ships the `mc` client
    entrypoint: ["sh", "/init/init.sh"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
      CANDIDATE_S3_ACCESS_KEY: ${CANDIDATE_S3_ACCESS_KEY}
      CANDIDATE_S3_SECRET_KEY: ${CANDIDATE_S3_SECRET_KEY}
    volumes:
      - ./infra/minio:/init:ro
    depends_on:
      minio:
        condition: service_healthy

  candidate:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/candidate/Dockerfile
    environment:
      SERVICE_NAME: candidate
      PORT: "8004"
      DATABASE_URL: postgresql+asyncpg://candidate_user:${CANDIDATE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: candidate
      REDIS_URL: redis://redis:6379/0              # token denylist (Identity writes, we read)
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${CANDIDATE_S3_ACCESS_KEY}    # the service's own MinIO user (resumes bucket only)
      S3_SECRET_KEY: ${CANDIDATE_S3_SECRET_KEY}
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//   # enqueues parse_resume
      FORWARDED_ALLOW_IPS: 172.30.0.10             # trust X-Forwarded-For only from the gateway
    ports:
      - "127.0.0.1:8004:8004"                      # debugging only: clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully  # bucket and user exist before we start
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8004/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  candidate-worker:                                # Celery worker: parses resumes in the background
    build:
      context: .
      dockerfile: services/candidate/Dockerfile    # same image as the API, different command
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-Q", "resumes", "--concurrency", "2", "--loglevel", "INFO"]
    environment:
      SERVICE_NAME: candidate
      DATABASE_URL: postgresql+asyncpg://candidate_user:${CANDIDATE_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: candidate
      S3_ENDPOINT: minio:9000
      S3_ACCESS_KEY: ${CANDIDATE_S3_ACCESS_KEY}
      S3_SECRET_KEY: ${CANDIDATE_S3_SECRET_KEY}
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully

  application:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/application/Dockerfile
    environment:
      SERVICE_NAME: application
      PORT: "8005"
      DATABASE_URL: postgresql+asyncpg://application_user:${APPLICATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: application
      REDIS_URL: redis://redis:6379/0              # token denylist + idempotency keys
      CANDIDATE_URL: http://candidate:8004         # applicant's profile at apply time (user's own token)
      FORWARDED_ALLOW_IPS: 172.30.0.10             # trust X-Forwarded-For only from the gateway
    ports:
      - "127.0.0.1:8005:8005"                      # debugging only: clients go through the gateway
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8005/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  job_enrichment:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/job_enrichment/Dockerfile
    environment:
      SERVICE_NAME: job_enrichment
      PORT: "8003"
      MONGO_URL: mongodb://mongo:27017/?directConnection=true
      MONGO_DATABASE: enrichment
      TEMPORAL_ADDRESS: temporal:7233              # its worker polls enrichment-tq
    ports:
      - "127.0.0.1:8003:8003"                      # internal read API (not routed via the gateway)
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8003/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  scoring:
    build:
      context: .                                   # repo root: the image needs libs/ too
      dockerfile: services/scoring/Dockerfile
    environment:
      SERVICE_NAME: scoring
      PORT: "8006"
      MONGO_URL: mongodb://mongo:27017/?directConnection=true
      MONGO_DATABASE: scoring
      CANDIDATE_URL: http://candidate:8004         # internal API: parsed resumes
      ENRICHMENT_URL: http://job_enrichment:8003   # internal API: structured jobs
    ports:
      - "127.0.0.1:8006:8006"                      # internal read API (not routed via the gateway)
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8006/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  notification:                                    # consumes events, queues emails (no public API)
    build:
      context: .
      dockerfile: services/notification/Dockerfile
    environment: &notification-env
      SERVICE_NAME: notification
      PORT: "8007"
      DATABASE_URL: postgresql+asyncpg://notification_user:${NOTIFICATION_DB_PASSWORD}@postgres:5432/${POSTGRES_DB}
      DB_SCHEMA: notification
      IDENTITY_URL: http://identity:8001           # internal API: recipients' addresses
      CELERY_BROKER_URL: amqp://guest:guest@rabbitmq:5672//
      SMTP_HOST: mailpit
      SMTP_PORT: "1025"
    ports:
      - "127.0.0.1:8007:8007"                      # health only
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:                                   # slim image has no curl, so use python
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8007/health/live')"]
      interval: 10s
      timeout: 3s
      retries: 5

  notification-worker:                             # Celery worker + beat (sweeper): sends the emails
    build:
      context: .
      dockerfile: services/notification/Dockerfile # same image, different command
    command: ["celery", "-A", "app.tasks.celery_app", "worker", "-B", "-Q", "emails", "--concurrency", "2", "--loglevel", "INFO"]
    environment: *notification-env                 # the same settings as the consumer above
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  mailpit:
    image: axllent/mailpit:v1.31.4                 # catches every email; nothing leaves your machine
    ports:
      - "127.0.0.1:1025:1025"                      # SMTP
      - "127.0.0.1:8025:8025"                      # web UI + API: http://localhost:8025

  # ------------------------------------------------------------ workflows + documents (Phase 9)
  temporal:
    # Temporal's dev server (temporal CLI): server + Web UI in one process, state in a SQLite file.
    # Production runs temporalio/server on Postgres/Cassandra with a separate UI; the old all-in-one
    # temporalio/auto-setup image is no longer maintained (last tag mid-2026). Pinned.
    image: temporalio/temporal:1.9.1
    command: ["server", "start-dev", "--ip", "0.0.0.0", "--ui-ip", "0.0.0.0", "--ui-port", "8233",
              "--db-filename", "/home/temporal/temporal.db"]
    ports:
      - "127.0.0.1:7233:7233"                      # gRPC: workers and clients connect here (no auth)
      - "127.0.0.1:8088:8233"                      # Web UI: http://localhost:8088
    volumes:
      - temporaldata:/home/temporal                # workflow histories survive restarts
    healthcheck:
      test: ["CMD", "temporal", "operator", "cluster", "health", "--address", "localhost:7233"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s

  mongo:
    image: mongo:8.0.34
    # A single-node REPLICA SET: MongoDB transactions (needed for the outbox: change + event together,
    # Phase 10 Scoring) only work on a replica set. Clients use ?directConnection=true
    command: ["--replSet", "rs0", "--bind_ip_all"]
    ports:
      - "127.0.0.1:27017:27017"                    # no auth locally (like Redis/Kafka): localhost only
    volumes:
      - mongodata:/data/db
    healthcheck:                                   # also initiates the replica set on first start
      test: ["CMD", "mongosh", "--quiet", "--eval",
             "try { rs.status().ok } catch (e) { rs.initiate({_id: 'rs0', members: [{_id: 0, host: 'mongo:27017'}]}).ok }"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 10s

  rabbitmq:
    image: rabbitmq:4.1.8-management
    environment:
      # Local dev: allow the default guest/guest account from other containers (it's localhost-only by
      # default). Like Redis/Kafka/Mongo here: no real credentials; production uses per-service users
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "-rabbit loopback_users []"
    ports:
      - "127.0.0.1:5672:5672"                      # AMQP (Celery)
      - "127.0.0.1:15672:15672"                    # management UI: http://localhost:15672 (guest/guest)
    volumes:
      - rabbitmqdata:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  # ------------------------------------------------------------ events (Phase 7)
  kafka:
    image: apache/kafka:4.3.1                      # official image; KRaft mode, no ZooKeeper
    environment:
      # One node that is both broker (stores/serves messages) and controller (cluster metadata)
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      CLUSTER_ID: i8Z_v918RlWSsFad7Sahhg           # fixed id (not a secret): the data volume belongs to this cluster
      # Listeners: Kafka tells clients which address to reconnect to ("advertised"). Containers must
      # be told kafka:19092, the host machine localhost:9092, so each gets its own listener.
      KAFKA_LISTENERS: INTERNAL://:19092,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:19092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /var/lib/kafka/data          # where messages are stored (the volume below)
      # Only one broker: Kafka's own internal topics can't have 3 copies (its default)
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_SHARE_COORDINATOR_STATE_TOPIC_MIN_ISR: 1
      # Topics are created on purpose (infra/kafka/create-topics.sh), never by a typo
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0    # dev: consumers start immediately (default waits 3 s)
      KAFKA_HEAP_OPTS: -Xmx512m -Xms512m           # keep the JVM laptop-sized
    ports:
      - "127.0.0.1:9092:9092"                      # localhost only: no authentication on this listener
    volumes:
      - kafkadata:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 20s

  kafka-init:                                      # one-shot: creates the topics, then exits
    image: apache/kafka:4.3.1                      # same image: it ships kafka-topics.sh
    entrypoint: ["bash", "/init/create-topics.sh"]
    volumes:
      - ./infra/kafka:/init:ro
    depends_on:
      kafka:
        condition: service_healthy

  schema-registry:
    image: confluentinc/cp-schema-registry:8.0.8
    environment:
      SCHEMA_REGISTRY_HOST_NAME: schema-registry
      SCHEMA_REGISTRY_LISTENERS: http://0.0.0.0:8081
      # Schemas are themselves stored in a Kafka topic (_schemas)
      SCHEMA_REGISTRY_KAFKASTORE_BOOTSTRAP_SERVERS: PLAINTEXT://kafka:19092
      SCHEMA_REGISTRY_KAFKASTORE_TOPIC_REPLICATION_FACTOR: 1
      # BACKWARD (the default, stated on purpose): a new schema version must still read old events
      SCHEMA_REGISTRY_SCHEMA_COMPATIBILITY_LEVEL: backward
      SCHEMA_REGISTRY_HEAP_OPTS: -Xmx256m -Xms256m
    ports:
      - "127.0.0.1:8081:8081"
    depends_on:
      kafka:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/subjects"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  schema-init:                                     # one-shot: registers the event schemas, then exits
    image: python:3.12-slim                        # the script needs only the standard library
    command: ["python", "/init/register.py"]
    environment:
      SCHEMA_REGISTRY_URL: http://schema-registry:8081
      PYTHONPATH: /chassis                         # imports smarthire_common.event_catalog (stdlib only)
    volumes:
      - ./infra/schema-registry:/init:ro
      - ./libs/smarthire_common:/chassis:ro         # the schemas live in the chassis package
    depends_on:
      schema-registry:
        condition: service_healthy

  kafka-ui:
    image: kafbat/kafka-ui:v1.5.0                  # maintained fork of provectuslabs/kafka-ui (abandoned)
    environment:
      KAFKA_CLUSTERS_0_NAME: smarthire-local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:19092
      KAFKA_CLUSTERS_0_SCHEMAREGISTRY: http://schema-registry:8081
    ports:
      - "127.0.0.1:8085:8080"                      # http://localhost:8085; no login, so localhost only
    depends_on:
      kafka:
        condition: service_healthy

  gateway:
    image: apache/apisix:3.19.0-debian               # pinned: upgrades are a deliberate change
    volumes:
      - ./infra/apisix/config.yaml:/usr/local/apisix/conf/config.yaml:ro
      - ./infra/apisix/apisix.yaml:/usr/local/apisix/conf/apisix.yaml:ro   # routes (standalone mode)
      - ./infra/apisix/plugins:/usr/local/apisix/custom/apisix/plugins:ro  # our Lua plugins
    ports:
      - "8000:9080"                                  # the one public entry point
    # :9091 (Prometheus metrics) is reachable inside the Compose network only, not published
    networks:
      default:
        ipv4_address: 172.30.0.10                    # fixed: services trust X-Forwarded-For from it
    depends_on:
      redis:
        condition: service_healthy                   # rate-limit counters and denylist live there
    healthcheck:                                     # no curl in the image: bash's /dev/tcp instead
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/7085 && printf 'GET /status/ready HTTP/1.0\\r\\n\\r\\n' >&3 && head -1 <&3 | grep -q ' 200 '"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  redisdata:
  miniodata:
  kafkadata:
  temporaldata:
  mongodata:
  rabbitmqdata:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.0.0/24                      # fixed range so the gateway can have a fixed IP
