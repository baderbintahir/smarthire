[project]
name = "smarthire-common"
version = "0.1.0"
description = "Shared chassis library for SmartHire services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "uuid6>=2024.1.12",
]

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "aiosqlite>=0.20", "httpx>=0.27"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smarthire_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
