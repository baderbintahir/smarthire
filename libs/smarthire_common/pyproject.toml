[project]
name = "smarthire-common"
version = "0.1.0"
description = "Shared chassis library for SmartHire services"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "sqlalchemy[asyncio]>=2.0",
    "asyncpg>=0.29",
    "uuid6>=2024.1.12",
    "redis>=5.0",
    "pyjwt[crypto]>=2.9",  # JWT verification (RS256)
    "httpx>=0.27",  # JWKS fetching
    "confluent-kafka[json,schemaregistry]>=2.6",
    "prometheus-client>=0.21",  # /metrics (Phase 13)
    # Tracing (Phase 13): SDK, OTLP/HTTP exporter to Jaeger, auto-instrumentation of the libraries we use
    "opentelemetry-sdk>=1.30",
    "opentelemetry-exporter-otlp-proto-http>=1.30",
    "opentelemetry-instrumentation-fastapi>=0.51b0",
    "opentelemetry-instrumentation-httpx>=0.51b0",
    "opentelemetry-instrumentation-sqlalchemy>=0.51b0",
    "opentelemetry-instrumentation-redis>=0.51b0",
]

[project.optional-dependencies]
# Only services that need them install these: `smarthire-common[temporal]`, `smarthire-common[mongo]`
temporal = ["temporalio[opentelemetry]>=1.9"]  # + its TracingInterceptor's dependencies
mongo = ["pymongo>=4.10", "opentelemetry-instrumentation-pymongo>=0.51b0"]  # PyMongo's own async API (Motor, its predecessor, is deprecated)
celery = ["celery>=5.4", "opentelemetry-instrumentation-celery>=0.51b0"]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "aiosqlite>=0.20",
    "httpx>=0.27",
    "fakeredis>=2.23",
    "testcontainers[postgres]>=4.8",
    "jsonschema>=4.23",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["smarthire_common"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
